<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lavaware</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- KEY SYSTEM -->
<div id="key-screen">
  <h1>Lavaware Access</h1>
  <input type="text" id="keyInput" placeholder="Enter access key">
  <button onclick="checkKey()">Unlock</button>
  <p id="keyError"></p>
</div>

<!-- MAIN SITE -->
<div id="site" class="hidden">
  <h1>Lavaware</h1>
  <p class="subtitle">Multi-Game Tool Suite</p>

  <div class="card">
    <h2>CS2 Features</h2>
    <ul>
      <li>Clean & simple UI</li>
      <li>Lightweight & fast</li>
      <li>Secure & undetected</li>
      <li>Frequent updates</li>
    </ul>
  </div>

  <div class="card">
    <h2>Bleeding Blades Script</h2>
    <ul>
      <li>Kill Aura</li>
      <li>Hitbox Expander</li>
      <li>Voice Spam</li>
      <li>Undetected for 1+ year</li>
    </ul>
    <button onclick="copyScript()">Copy Script</button>
    <p id="copied"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
