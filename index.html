<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lavaware</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    .hidden { display: none; }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal {
      background: #141414;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      color: white;
      box-shadow: 0 0 30px rgba(255,0,0,0.3);
    }

    /* 🔼 MOVE ONLY THE TEXT UP */
    .modal h2 {
      margin-top: -12px;
      margin-bottom: 15px;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 12px;
      text-align: center;
      background: #1a1a1a;
      color: white;
    }

    .modal button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #ff3b3b;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .modal button:hover { background: #ff1f1f; }

    #error {
      color: #ff5c5c;
      margin-top: 10px;
      font-size: 14px;
    }

    /* DISCORD LINK (AUTH SCREEN ONLY) */
    #authDiscord {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-weight: bold;
      color: #ff3b3b;
      text-decoration: none;
      letter-spacing: 1px;
      z-index: 10000;
    }

    #authDiscord:hover {
      text-shadow: 0 0 10px #ff3b3b;
    }
  </style>
</head>

<body class="locked">

  <div id="overlay">
    <div class="modal">
      <h2>Enter Access Key</h2>
      <input type="text" id="keyInput" placeholder="XXXXXX-XXXXXX-XXXXXX">
      <button type="button" onclick="submitKey()">Unlock</button>
      <p id="error"></p>
    </div>

    <!-- CLICKABLE DISCORD LINK ON AUTH SCREEN -->
    <a
      id="authDiscord"
      href="https://discord.gg/YOUR_INVITE_HERE"
      target="_blank"
    >
      DISCORD
    </a>
  </div>

  <script src="./auth.js"></script>
  <audio id="authSound" src="addlater.mp3" preload="auto"></audio>

</body>
</html>
