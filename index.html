<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lavaware</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    .hidden { display: none; }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal {
      background: #141414;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      color: white;
      box-shadow: 0 0 30px rgba(255,0,0,0.3);
    }

    .modal h2 {
      margin-bottom: 6px;
    }

    .modal h1 {
      font-size: 14px;
      font-weight: normal;
      color: #aaa;
      margin-bottom: 15px;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 12px;
      text-align: center;
      background: #1a1a1a;
      color: white;
    }

    .modal button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #ff3b3b;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .modal button:hover {
      background: #ff1f1f;
    }

    .discord-link {
      margin-top: 14px;
      font-size: 13px;
    }

    .discord-link a {
      color: #7289da;
      text-decoration: none;
      font-weight: bold;
    }

    .discord-link a:hover {
      text-decoration: underline;
    }

    #error {
      color: #ff5c5c;
      margin-top: 10px;
      font-size: 14px;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #0a0a0a;
      padding: 20px;
      border-right: 1px solid #222;
    }

    .sidebar h2 {
      margin-bottom: 20px;
      font-family: 'Orbitron', sans-serif;
      color: #ff3b3b;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      background: #1a1a1a;
      border: none;
      color: #ff3b3b;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }

    .content {
      flex: 1;
      padding: 40px;
      position: relative;
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>

<body class="locked">

 
  <div id="overlay">
    <div class="modal">
      <h2>Enter Access Key</h2>
      <h1>To get a key be a member of lava</h1>

      <input type="text" id="keyInput" placeholder="XXXXXX-XXXXXX-XXXXXX">
      <button type="button" onclick="submitKey()">Unlock</button>

      <p id="error"></p>

      
      <div class="discord-link">
        Need a key? Join our discord and be a offcail lava member
        <a href="https://discord.gg/YOUR_LINK_HERE" target="_blank">Discord</a>
      </div>
    </div>
  </div>


  <div id="site" class="hidden app">
    <div class="sidebar">
      <h2>Lavaware</h2>
      <button onclick="showPage('cs2')">CS2</button>
      <button onclick="showPage('bb')">Bleeding Blades</button>
    </div>

    <div class="content">
      <div id="cs2" class="page active">
        <h1>CS2</h1>
        <p>Internal tool features</p>
      </div>

      <div id="bb" class="page">
        <h1>Bleeding Blades</h1>
        <p>Script features</p>
      </div>
    </div>
  </div>

  <script src="./auth.js"></script>
</body>
</html>
