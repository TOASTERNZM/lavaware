<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lavaware</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #0b0b0b; color: white; }
    .hidden { display: none; }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal {
      background: #141414;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255,0,0,0.3);
    }

    .modal input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
      background: #1a1a1a;
      color: white;
      text-align: center;
    }

    .modal button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #ff3b3b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .app { display: flex; height: 100vh; }

    .sidebar {
      width: 220px;
      background: #0a0a0a;
      padding: 20px;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      background: #1a1a1a;
      border: none;
      color: #ff3b3b;
      cursor: pointer;
      border-radius: 6px;
    }

    .content {
      flex: 1;
      padding: 40px;
      position: relative;
    }

    .page {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    .page.active {
      opacity: 1;
      pointer-events: all;
    }

    #copied {
      margin-top: 10px;
      color: #4cff4c;
    }
  </style>
</head>

<body class="locked">

<!-- 🔊 Unlock sound -->
<audio id="unlockSound" src="efj.mp3" preload="auto"></audio>

<div id="overlay">
  <div class="modal">
    <h2>Enter Access Key</h2>
    <input id="keyInput" placeholder="XXXXXX-XXXXXX-XXXXXX">
    <button onclick="handleUnlock()">Unlock</button>
    <p id="error"></p>
  </div>
</div>

<div id="site" class="hidden app">
  <div class="sidebar">
    <button onclick="showPage('cs2')">CS2</button>
    <button onclick="showPage('bb')">Bleeding Blades</button>
  </div>

  <div class="content">
    <div id="cs2" class="page active">
      <h1>CS2</h1>
      <p>IN THE WORKS</p>
    </div>

    <div id="bb" class="page">
      <h1>Bleeding Blades</h1>
      <button onclick="copyScript()">Copy Script</button>
      <button onclick="downloadScript()">⬇ Download</button>
      <p id="copied"></p>
    </div>
  </div>
</div>

<script>
  const unlockSound = document.getElementById("unlockSound");

  function handleUnlock() {
    unlockSound.currentTime = 0;
    unlockSound.play().catch(()=>{});
    submitKey(); // from auth.js
  }

  document.getElementById("keyInput").addEventListener("keydown", e => {
    if (e.key === "Enter") handleUnlock();
  });

  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => {
      p.classList.toggle("active", p.id === id);
    });
  }

  function copyScript() {
    fetch("https://hidden-mode-5dee.casdcasca26.workers.dev/bb")
      .then(r => r.text())
      .then(t => {
        navigator.clipboard.writeText(t);
        copied.textContent = "Copied!";
        setTimeout(()=>copied.textContent="",2000);
      })
      .catch(()=> copied.textContent="Failed");
  }

  function downloadScript() {
    fetch("https://hidden-mode-5dee.casdcasca26.workers.dev/bb")
      .then(r => r.text())
      .then(t => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([t]));
        a.download = "bleeding_blades.txt";
        a.click();
      });
  }
</script>

<script src="./auth.js"></script>
</body>
</html>
