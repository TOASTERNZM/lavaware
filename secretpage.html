<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECRET PARTY TIME</title>

<style>
:root {
  --bg-gif: url("funnygiff.gif");
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-gif) center / cover no-repeat fixed;
  font-family: Arial, sans-serif;
  overflow: hidden;
  cursor: pointer;
  animation: hue 12s linear infinite;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

h1 {
  font-size: 72px;
  color: #fff;
  text-shadow:
    0 0 15px #ff00ff,
    0 0 40px #00ffff,
    0 0 80px #ff0000;
  animation: pulse 1s infinite alternate;
}

p {
  color: #fff;
  letter-spacing: 4px;
}

.click {
  margin-top: 30px;
  color: #00ffff;
  text-shadow: 0 0 20px #00ffff;
  animation: blink 0.8s infinite;
}

.laser {
  position: fixed;
  width: 2px;
  height: 120vh;
  pointer-events: none;
  z-index: 6;
  filter: blur(1px);
  border-radius: 1px;
}

.particle {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: hsl(var(--h),100%,60%);
  animation: float 6s linear infinite;
  z-index: 4;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.15); }
}

@keyframes blink {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}
</style>
</head>

<body>

<div class="overlay">
  <h1>SECRET MODE</h1>
  <p>ACCESS GRANTED</p>
  <div class="click">CLICK TO START PARTY</div>
</div>

<audio id="music" src="efj.mp3" loop crossorigin="anonymous"></audio>

<script>
const music = document.getElementById("music");
let started = false;

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const src = ctx.createMediaElementSource(music);
const analyser = ctx.createAnalyser();
analyser.fftSize = 256;
src.connect(analyser);
analyser.connect(ctx.destination);

const data = new Uint8Array(analyser.frequencyBinCount);

document.addEventListener("click", () => {
  if (!started) {
    ctx.resume();
    music.volume = 1;
    music.play();
    started = true;
    document.querySelector(".click").remove();
  }
});


for (let i = 0; i < 70; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 6 + "s";
  p.style.setProperty("--h", Math.random() * 360);
  document.body.appendChild(p);
}


const lasers = [];
for (let i = 0; i < 12; i++) {
  const l = document.createElement("div");
  l.className = "laser";
  l.style.left = (i * 8) + "vw";
  l.dataset.speed = 0.5 + Math.random() * 1.5;
  document.body.appendChild(l);
  lasers.push(l);
}

let time = 0;

function animate() {
  requestAnimationFrame(animate);
  analyser.getByteFrequencyData(data);

  const bass = data.slice(0, 20).reduce((a,b)=>a+b,0)/20;
  const mid = data.slice(30,80).reduce((a,b)=>a+b,0)/50;
  const power = (bass + mid) / 2;

  lasers.forEach((l, i) => {
    const speed = parseFloat(l.dataset.speed);
    const angle = Math.sin(time*speed + i) * 45; 
    const hue = (time*50 + i*30 + power*2) % 360;
    l.style.background = `linear-gradient(${angle}deg, hsl(${hue},100%,60%), transparent)`;
    l.style.height = (50 + power/2) + "vh";
    l.style.top = (30 + Math.sin(time*speed + i*1.2)*50) + "vh";
  });

  time += 0.05;
}

animate();
</script>

</body>
</html>
