<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECRET PARTY TIME</title>

<style>
:root {
  --bg-gif: url("funnygiff.gif");
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-gif) center / cover no-repeat fixed;
  font-family: Arial, sans-serif;
  overflow: hidden;
  cursor: pointer;
  animation: hue 10s linear infinite;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

h1 {
  font-size: 72px;
  color: #fff;
  text-shadow:
    0 0 15px #ff00ff,
    0 0 40px #00ffff,
    0 0 80px #ff0000;
  animation: pulse 1s infinite alternate;
}

p {
  color: #fff;
  letter-spacing: 4px;
}

.click {
  margin-top: 30px;
  color: #00ffff;
  text-shadow: 0 0 20px #00ffff;
  animation: blink 0.8s infinite;
}

.laser {
  position: fixed;
  height: 3px;
  opacity: 0.9;
  pointer-events: none;
  z-index: 6;
  filter: blur(0.4px);
  will-change: transform, background, box-shadow;
  border-radius: 100px;
  /* Create squiggly effect using clip-path */
  clip-path: polygon(0% 50%, 10% 40%, 20% 60%, 30% 30%, 40% 70%, 
                     50% 40%, 60% 60%, 70% 30%, 80% 70%, 90% 40%, 
                     100% 50%);
}

.laser.left {
  left: 0;
  width: 40vw; /* Shorter for side lasers */
  transform-origin: left center;
}

.laser.right {
  right: 0;
  width: 40vw; /* Shorter for side lasers */
  transform-origin: right center;
}

.particle {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: hsl(var(--h),100%,60%);
  animation: float 6s linear infinite;
  z-index: 4;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.15); }
}

@keyframes blink {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}
</style>
</head>

<body>

<div class="overlay">
  <h1>STILL IN THE WORKS FIXING THE LASER </h1>
  
  <div class="click">CLICK TO START PARTY</div>
</div>

<audio id="music" src="efj.mp3" loop crossorigin="anonymous"></audio>

<script>
const music = document.getElementById("music");
let started = false;

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const src = ctx.createMediaElementSource(music);
const analyser = ctx.createAnalyser();
analyser.fftSize = 64;
src.connect(analyser);
analyser.connect(ctx.destination);

const data = new Uint8Array(analyser.frequencyBinCount);

document.addEventListener("click", () => {
  if (!started) {
    ctx.resume();
    music.volume = 1;
    music.play();
    started = true;
    document.querySelector(".click").remove();
  }
});

const lasers = [];

// Create lasers on the sides
for (let i = 0; i < 5; i++) {
  const left = document.createElement("div");
  left.className = "laser left";
  document.body.appendChild(left);

  const right = document.createElement("div");
  right.className = "laser right";
  document.body.appendChild(right);

  lasers.push({ 
    left, 
    right, 
    // Position vertically spaced
    topPosition: (i + 1) * (100 / 6) + '%',
    // Different wave patterns
    waveSpeed: 0.2 + (i * 0.15),
    waveIntensity: 0.3 + (i * 0.1),
    beatPhase: i * 2
  });
}

// Reduced particle count
for (let i = 0; i < 20; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 6 + "s";
  p.style.setProperty("--h", Math.random() * 360);
  document.body.appendChild(p);
}

let lastTime = 0;
const fps = 30;
const interval = 1000 / fps;

function animate(timestamp) {
  if (timestamp - lastTime < interval) {
    requestAnimationFrame(animate);
    return;
  }
  
  lastTime = timestamp;
  analyser.getByteFrequencyData(data);
  
  // Simple bass detection
  let bass = 0;
  for (let i = 0; i < 10; i++) bass += data[i];
  bass = bass / 10 / 128;
  
  const time = Date.now() * 0.001;
  
  lasers.forEach((l, i) => {
    // Create squiggly movement
    const wave1 = Math.sin(time * l.waveSpeed + l.beatPhase) * 100 * l.waveIntensity;
    const wave2 = Math.sin(time * l.waveSpeed * 1.7 + l.beatPhase) * 80 * l.waveIntensity;
    const wave3 = Math.sin(time * l.waveSpeed * 2.3 + l.beatPhase) * 60 * l.waveIntensity;
    
    // Add beat response to waves
    const beatWave = bass * 50;
    
    // Color based on position and time
    const hue = (time * 30 + i * 72) % 360;
    const color = `hsl(${hue}, 100%, 60%)`;
    
    // Calculate total squiggle
    const totalSquiggle = (wave1 + wave2 + wave3) / 3 + beatWave;
    
    // Position lasers at sides
    l.left.style.top = l.topPosition;
    l.right.style.top = l.topPosition;
    
    // Left lasers: from left edge moving inward
    l.left.style.transform = `
      translateY(${totalSquiggle}px) 
      scaleX(${0.7 + bass * 0.5})
    `;
    
    // Right lasers: from right edge moving inward
    l.right.style.transform = `
      translateY(${-totalSquiggle}px) 
      scaleX(${0.7 + bass * 0.5})
    `;
    
    // Gradient backgrounds pointing inward
    l.left.style.background = `
      linear-gradient(to right, ${color}, transparent 70%)
    `;
    l.right.style.background = `
      linear-gradient(to left, ${color}, transparent 70%)
    `;
    
    // Glow effect
    const glow = 15 + bass * 30;
    l.left.style.boxShadow = `
      0 0 ${glow}px ${color},
      0 0 ${glow * 2}px ${color}
    `;
    l.right.style.boxShadow = `
      0 0 ${glow}px ${color},
      0 0 ${glow * 2}px ${color}
    `;
    
    // Thickness responds to beat
    l.left.style.height = (2 + bass * 4) + 'px';
    l.right.style.height = (2 + bass * 4) + 'px';
    
    // Opacity pulse
    l.left.style.opacity = 0.7 + bass * 0.3;
    l.right.style.opacity = 0.7 + bass * 0.3;
  });
  
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
