<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECRET PARTY TIME</title>

<style>
:root {
  --bg-gif: url("funnygiff.gif");
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-gif) center / cover no-repeat fixed;
  font-family: Arial, sans-serif;
  overflow: hidden;
  cursor: pointer;
  animation: hue 8s linear infinite;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

h1 {
  font-size: 72px;
  color: #fff;
  text-shadow:
    0 0 15px #ff00ff,
    0 0 40px #00ffff,
    0 0 80px #ff0000;
  animation: pulse 0.9s infinite alternate;
}

p {
  color: #fff;
  letter-spacing: 4px;
}

.click {
  margin-top: 30px;
  color: #00ffff;
  text-shadow: 0 0 20px #00ffff;
  animation: blink 0.8s infinite;
}

.strobe {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}

.laser {
  position: fixed;
  height: 6px;
  width: 100vw;
  left: 0;
  transform-origin: center;
  opacity: 0.9;
  pointer-events: none;
  z-index: 6;
}

.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: hsl(var(--h),100%,60%);
  animation: float 6s linear infinite;
  z-index: 5;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.15); }
}

@keyframes blink {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}
</style>
</head>

<body>

<div class="strobe"></div>

<div class="overlay">

  <div class="click">CLICK TO START PARTY</div>
</div>

<audio id="music" src="efj.mp3" loop crossorigin="anonymous"></audio>

<script>
const music = document.getElementById("music");
let started = false;

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const src = ctx.createMediaElementSource(music);
const analyser = ctx.createAnalyser();
analyser.fftSize = 256;
src.connect(analyser);
analyser.connect(ctx.destination);

const data = new Uint8Array(analyser.frequencyBinCount);

document.addEventListener("click", () => {
  if (!started) {
    ctx.resume();
    music.volume = 1;
    music.play();
    started = true;
    document.querySelector(".click").remove();
  }
});

const lasers = [];
for (let i = 0; i < 5; i++) {
  const l = document.createElement("div");
  l.className = "laser";
  l.style.top = Math.random() * 100 + "vh";
  document.body.appendChild(l);
  lasers.push(l);
}

for (let i = 0; i < 80; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 6 + "s";
  p.style.setProperty("--h", Math.random() * 360);
  document.body.appendChild(p);
}

function animate() {
  requestAnimationFrame(animate);
  analyser.getByteFrequencyData(data);

  let bass = data.slice(0, 15).reduce((a,b)=>a+b,0) / 15;
  let mid = data.slice(30, 80).reduce((a,b)=>a+b,0) / 50;

  lasers.forEach((l, i) => {
    const power = (bass + mid) / 2;
    l.style.background = `linear-gradient(90deg, transparent, hsl(${power*2},100%,60%), transparent)`;
    l.style.transform = `scaleX(${1 + power / 120}) rotate(${i * 15 + power / 8}deg)`;
    l.style.top = 20 + i * 15 + (power / 20) + "vh";
  });

  document.querySelector(".strobe").style.opacity = bass > 180 ? 0.8 : 0;
}

animate();
</script>

</body>
</html>
