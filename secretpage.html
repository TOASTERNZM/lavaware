<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECRET PARTY TIME</title>

<style>
:root {
  --bg-gif: url("funnygiff.gif"); /* CHANGE GIF HERE */
}

/* RESET */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-gif) center center / cover no-repeat fixed;
  font-family: Arial, sans-serif;
  overflow: hidden;
  cursor: pointer;
}

/* DARK OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 5;
}

/* TITLE */
h1 {
  font-size: 64px;
  color: #fff;
  text-shadow:
    0 0 10px #ff00ff,
    0 0 30px #ff00ff,
    0 0 60px #ff0000;
  animation: pulse 1.2s infinite alternate;
}

p {
  color: #ccc;
  letter-spacing: 3px;
  opacity: 0.8;
}

.click {
  margin-top: 25px;
  color: #ff5cff;
  text-shadow: 0 0 15px #ff5cff;
  animation: blink 1s infinite;
}

/* STROBE FLASH */
.strobe {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  animation: strobe 0.15s infinite;
  z-index: 2;
  pointer-events: none;
}

/* LASERS */
.laser {
  position: fixed;
  width: 200%;
  height: 4px;
  background: linear-gradient(90deg, transparent, #00ffea, transparent);
  opacity: 0.8;
  animation: laserMove 1.2s linear infinite;
  pointer-events: none;
  z-index: 3;
}

/* PARTICLES */
.particle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #ff3bff;
  border-radius: 50%;
  animation: float 6s linear infinite;
  opacity: 0.9;
  z-index: 4;
}

/* ANIMATIONS */
@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

@keyframes blink {
  0%,100% { opacity: 0.3; }
  50% { opacity: 1; }
}

@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

@keyframes strobe {
  0%,90% { opacity: 0; }
  95% { opacity: 0.9; }
  100% { opacity: 0; }
}

@keyframes laserMove {
  from { transform: translateX(-50%) rotate(0deg); }
  to { transform: translateX(50%) rotate(360deg); }
}
</style>
</head>

<body>

<div class="strobe"></div>

<div class="overlay">
  <h1>SECRET MODE</h1>
  <p>ACCESS GRANTED</p>
  <div class="click">CLICK TO START PARTY</div>
</div>

<audio id="music" src="efj.mp3" loop></audio>

<script>
const music = document.getElementById("music");
let started = false;

/* Start party */
document.addEventListener("click", () => {
  if (!started) {
    music.volume = 0.9;
    music.play();
    started = true;
    document.querySelector(".click").remove();
  }
});

/* Particles */
for (let i = 0; i < 60; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 6 + "s";
  p.style.animationDuration = 3 + Math.random() * 6 + "s";
  document.body.appendChild(p);
}

/* Lasers */
for (let i = 0; i < 6; i++) {
  const l = document.createElement("div");
  l.className = "laser";
  l.style.top = Math.random() * 100 + "vh";
  l.style.animationDelay = Math.random() + "s";
  document.body.appendChild(l);
}
</script>

</body>
</html>
