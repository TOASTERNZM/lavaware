<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECRET PARTY TIME</title>

<style>
:root {
  --bg-gif: url("funnygiff.gif");
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-gif) center / cover no-repeat fixed;
  font-family: Arial, sans-serif;
  overflow: hidden;
  cursor: pointer;
  animation: hue 10s linear infinite;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

h1 {
  font-size: 72px;
  color: #fff;
  text-shadow:
    0 0 15px #ff00ff,
    0 0 40px #00ffff,
    0 0 80px #ff0000;
  animation: pulse 1s infinite alternate;
}

p {
  color: #fff;
  letter-spacing: 4px;
}

.click {
  margin-top: 30px;
  color: #00ffff;
  text-shadow: 0 0 20px #00ffff;
  animation: blink 0.8s infinite;
}

.laser {
  position: fixed;
  width: 50vw;
  height: 6px;
  opacity: 0.9;
  pointer-events: none;
  z-index: 6;
  filter: blur(0.4px);
  will-change: transform;
  border-radius: 100px;
  transform-origin: center;
}

/* Updated laser positions */
.laser.left {
  left: 0;
}

.laser.right {
  right: 0;
}

.particle {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: hsl(var(--h),100%,60%);
  animation: float 6s linear infinite;
  z-index: 4;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.15); }
}

@keyframes blink {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}
</style>
</head>

<body>

<div class="overlay">
  <h1>STILL IN THE WORKS FIXING THE LASER </h1>
  
  <div class="click">CLICK TO START PARTY</div>
</div>

<audio id="music" src="efj.mp3" loop crossorigin="anonymous"></audio>

<script>
const music = document.getElementById("music");
let started = false;

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const src = ctx.createMediaElementSource(music);
const analyser = ctx.createAnalyser();
analyser.fftSize = 256;
src.connect(analyser);
analyser.connect(ctx.destination);

const data = new Uint8Array(analyser.frequencyBinCount);

document.addEventListener("click", () => {
  if (!started) {
    ctx.resume();
    music.volume = 1;
    music.play();
    started = true;
    document.querySelector(".click").remove();
  }
});

const lasers = [];

// Create more lasers for better effect
for (let i = 0; i < 6; i++) {
  const left = document.createElement("div");
  left.className = "laser left";
  document.body.appendChild(left);

  const right = document.createElement("div");
  right.className = "laser right";
  document.body.appendChild(right);

  lasers.push({ 
    left, 
    right, 
    offset: i * 8, // Vertical spacing
    waveSpeed: 0.5 + (i * 0.3), // Different wave speeds
    waveAmount: 0.3 + (i * 0.2), // Different wave amplitudes
    beatPhase: i * 0.5 // Different beat phases
  });
}

for (let i = 0; i < 70; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 6 + "s";
  p.style.setProperty("--h", Math.random() * 360);
  document.body.appendChild(p);
}

let time = 0;

function animate() {
  requestAnimationFrame(animate);
  analyser.getByteFrequencyData(data);

  const bass = data.slice(0, 20).reduce((a,b)=>a+b,0) / 20;
  const mid  = data.slice(40, 90).reduce((a,b)=>a+b,0) / 50;
  const power = (bass + mid) / 2;
  
  time += 0.02;

  lasers.forEach((l, i) => {
    const glow = power * 2;
    const thickness = 3 + power / 20;
    
    // Beat-responsive values
    const beatIntensity = Math.max(0.2, power / 128);
    const waveIntensity = beatIntensity * l.waveAmount;
    const waveFrequency = l.waveSpeed * 2 + beatIntensity;
    
    // Calculate wave position
    const waveOffset = Math.sin(time * waveFrequency + l.beatPhase) * 50 * waveIntensity;
    const waveCurve = Math.cos(time * waveFrequency * 0.7 + l.beatPhase) * 25 * waveIntensity;
    
    // Smooth color transition based on beat
    const hue = (time * 20 + i * 60 + power) % 360;
    const color = `hsl(${hue}, 100%, 60%)`;

    // Apply styles with wave effect
    l.left.style.height = thickness + "px";
    l.right.style.height = thickness + "px";

    // Left lasers wave from left to right
    l.left.style.background =
      `linear-gradient(90deg, ${color}, transparent)`;
    l.left.style.transform = 
      `translateY(${l.offset}vh) translateY(${waveOffset}px) skewY(${waveCurve}deg) scaleX(${0.8 + beatIntensity * 0.4})`;
    
    // Right lasers wave from right to left (mirrored)
    l.right.style.background =
      `linear-gradient(270deg, ${color}, transparent)`;
    l.right.style.transform = 
      `translateY(${-l.offset}vh) translateY(${-waveOffset}px) skewY(${-waveCurve}deg) scaleX(${0.8 + beatIntensity * 0.4})`;

    // Glow effect that pulses with beat
    const glowSize = glow * (0.8 + beatIntensity * 0.5);
    l.left.style.boxShadow =
      `0 0 ${glowSize}px ${color}, 0 0 ${glowSize * 2}px ${color}`;
    l.right.style.boxShadow =
      `0 0 ${glowSize}px ${color}, 0 0 ${glowSize * 2}px ${color}`;

    // Opacity also pulses with beat
    l.left.style.opacity = 0.7 + beatIntensity * 0.3;
    l.right.style.opacity = 0.7 + beatIntensity * 0.3;
  });
}

animate();
</script>

</body>
</html>
