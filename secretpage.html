<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  <title> SECRET PARTY TIME </title>
    <style>
      :root {
       --bg-gif:url ("funnygiff.gif");
    
      
  }

      *{
        box-sizing: border-box;
      }
      body{
        margin: 0;
        height: 100vh;
        backgrouind:var (--bg-gif) center center /cover no-repeat fixed;
        font-family: Arial, sans-serif;
        overflow: hidden;
        cursor: pointer;
         }
      
      .overlay{
        position: fixed;
        inset: 0;
        background: rbga(0,0,0,0.45);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: colun;
         }

      h1{
        font-size: 64px;
        color: #fff;
        text-shadow:
          0 0 10px #ff00ff,
          0 0 20px #ff00FF,
          0 0 40px #ff0000;
        anmation: pulse 1.5s infinite alternate;
        margin-bottom: 10px;
         }
      p {
        color: #ccc;
        font-size: 18px;
        letter-spacing: 2px;
        opacity: 0.8;
         }

      .click{
        margin-top:25px;
        font-size: 14px;
        color: #ff5cff;
       text-shadow: 0 0 10px #ff5cff;
        animation: blink 1.2s infinite;
         }
      
        @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ff3bff;
      border-radius: 50%;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) scale(0.5);
      }
      to {
        transform: translateY(-10vh) scale(1.5);
      }
    }
  </style>
</head>

<body>
  <div class="overlay" id="overlay">
    <h1>SECRET MODE</h1>
    <p>ACCESS GRANTED</p>
    <div class="click">CLICK PARTY </div>
  </div>

  <audio id="music" src="efj.mp3" loop></audio>

  <script>
    const music = document.getElementById("music");
    let started = false;

    document.addEventListener("click", () => {
      if (!started) {
        music.volume = 0.8;
        music.play();
        started = true;
        document.querySelector(".click").remove();
      }
    });

    for(let i = 0; i<40; i++) {
      const p =document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() *100 +"vw";
      p.style.animationDelay = Math.random() * 6 + "s";
      p.style.animationDuration = 4 + Math.random() * 6 + "s";
      document.body.appendChild(p);
    }

      

      
  </script
    </body>
      </html>
