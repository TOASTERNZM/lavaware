<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECRET PARTY TIME</title>

<style>
:root {
  --bg-gif: url("funnygiff.gif");
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-gif) center center / cover no-repeat fixed;
  font-family: Arial, sans-serif;
  overflow: hidden;
  cursor: pointer;
  animation: hue 6s linear infinite, shake 0.15s infinite;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

h1 {
  font-size: 72px;
  color: #fff;
  text-shadow:
    0 0 10px #ff00ff,
    0 0 30px #00ffff,
    0 0 60px #ff0000;
  animation: pulse 0.9s infinite alternate, glitch 0.25s infinite;
}

p {
  color: #fff;
  letter-spacing: 4px;
  opacity: 0.85;
}

.click {
  margin-top: 30px;
  font-size: 14px;
  color: #00ffff;
  text-shadow: 0 0 20px #00ffff;
  animation: blink 0.8s infinite;
}

.strobe {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  animation: strobe 0.12s infinite;
  pointer-events: none;
  z-index: 4;
}

.laser {
  position: fixed;
  width: 250%;
  height: 5px;
  background: linear-gradient(90deg, transparent, red, cyan, magenta, transparent);
  opacity: 0.9;
  animation: laserMove 0.8s linear infinite;
  pointer-events: none;
  z-index: 6;
}

.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: hsl(var(--h),100%,60%);
  animation: float 5s linear infinite;
  opacity: 1;
  z-index: 5;
}

.confetti {
  position: fixed;
  width: 10px;
  height: 14px;
  background: hsl(var(--c),100%,60%);
  animation: confetti 3s linear infinite;
  z-index: 7;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.15); }
}

@keyframes blink {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

@keyframes float {
  from { transform: translateY(110vh) rotate(0deg); }
  to { transform: translateY(-10vh) rotate(720deg); }
}

@keyframes strobe {
  0%,88% { opacity: 0; }
  92% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes laserMove {
  from { transform: translateX(-60%) rotate(0deg); }
  to { transform: translateX(60%) rotate(360deg); }
}

@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-3px, 3px); }
  40% { transform: translate(3px, -3px); }
  60% { transform: translate(-2px, 2px); }
  80% { transform: translate(2px, -2px); }
  100% { transform: translate(0); }
}

@keyframes shake {
  0% { transform: translate(0); }
  25% { transform: translate(2px, -2px); }
  50% { transform: translate(-2px, 2px); }
  75% { transform: translate(2px, 2px); }
  100% { transform: translate(0); }
}

@keyframes confetti {
  from { transform: translateY(-10vh) rotate(0deg); }
  to { transform: translateY(110vh) rotate(720deg); }
}
</style>
</head>

<body>

<div class="strobe"></div>

<div class="overlay">
  <h1>SECRET MODE</h1>
  <p>ACCESS GRANTED</p>
  <div class="click">CLICK TO START PARTY</div>
</div>

<audio id="music" src="efj.mp3" loop></audio>

<script>
const music = document.getElementById("music");
let started = false;

document.addEventListener("click", () => {
  if (!started) {
    music.volume = 1;
    music.play();
    started = true;
    document.querySelector(".click").remove();
  }
});

for (let i = 0; i < 80; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 5 + "s";
  p.style.setProperty("--h", Math.random() * 360);
  document.body.appendChild(p);
}

for (let i = 0; i < 8; i++) {
  const l = document.createElement("div");
  l.className = "laser";
  l.style.top = Math.random() * 100 + "vh";
  l.style.animationDelay = Math.random() + "s";
  document.body.appendChild(l);
}

for (let i = 0; i < 120; i++) {
  const c = document.createElement("div");
  c.className = "confetti";
  c.style.left = Math.random() * 100 + "vw";
  c.style.animationDelay = Math.random() * 3 + "s";
  c.style.setProperty("--c", Math.random() * 360);
  document.body.appendChild(c);
}
</script>

</body>
</html>
